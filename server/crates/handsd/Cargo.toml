[package]
name = "handsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phone-approved LUKS unlock daemon for OpenMediaVault"

[lib]
name = "handsd"
path = "src/lib.rs"

[[bin]]
name = "handsd"
path = "src/main.rs"

[dependencies]
hands-proto = { path = "../hands-proto" }
bytes = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "sync", "time", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
zeroize = "1"

[dev-dependencies]
hands-client = { path = "../hands-client" }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[package.metadata.deb]
name = "server-hands"
maintainer = "Hamid Moazzami <hi@samsaz.com>"
section = "admin"
priority = "optional"
depends = "libc6, libcryptsetup12, systemd"
recommends = "cryptsetup-bin"
maintainer-scripts = "../../packaging/debian"
conf-files = ["/etc/server-hands/config.toml"]
assets = [
  ["target/release/handsd", "usr/sbin/", "755"],
  ["target/release/handsctl", "usr/sbin/", "755"],
  ["../../packaging/systemd/handsd.service", "lib/systemd/system/", "644"],
  ["../../packaging/systemd/handsd.socket", "lib/systemd/system/", "644"],
  ["../../packaging/systemd/hands-unlocked.target", "lib/systemd/system/", "644"],
  ["../../packaging/config/config.toml", "etc/server-hands/config.toml", "640"],
  ["../../packaging/systemd-conf/10-server-hands.conf", "usr/share/server-hands/", "644"],
  ["../../../docs/homelab-setup.md", "usr/share/doc/server-hands/README.md", "644"],
  ["../../packaging/dropins/gated-service.conf", "usr/share/server-hands/gated-service.conf", "644"],
  ["../../packaging/examples/post-unlock-example.sh", "usr/share/server-hands/post-unlock-example.sh", "755"],
]
